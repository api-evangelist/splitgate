apis:
- aid: splitgate:third-party-api
  name: 1047 Games Third-Party API
  description: 'Public read-only HTTP API from 1047 Games for retrieving player statistics,
    player ranks, match history and match details for Splitgate. Five GET operations
    over a bearer-JWT-secured surface: search players by display name, fetch a player''s
    summary statistics, fetch current competitive ranks, page through match history,
    and read a single match''s full team and player breakdown. Cursor pagination uses
    an opaque page anchor; errors follow a reason/message/domain/metadata envelope
    with a discriminated gRPC-style status detail.'
