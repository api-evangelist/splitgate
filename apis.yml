aid: splitgate
name: Splitgate
description: 'Splitgate is the free-to-play sci-fi arena first-person shooter franchise
  built by 1047 Games, the Stanford-founded studio behind the portal-plus-FPS formula
  that shipped as Splitgate (2019), Splitgate 2 (June 2025) and, after a full rebuild,
  SPLITGATE: Arena Reloaded (December 2025). Beyond the game itself, 1047 Games publishes
  a small public Third-Party API — an OpenAPI 3.0.1 contract served from the studio''s
  own GitHub organization with a Swagger UI reference — exposing player search, career
  and per-mode statistics, competitive ranks, match history and full match details
  so community stat trackers, esports tooling and leaderboard sites can build against
  real game data.'
